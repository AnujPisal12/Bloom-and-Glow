<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bloom & Glow — Handcrafted Candles</title>
    <script>
      // Fallback SPA redirect for GitHub Pages
      var l = window.location;
      var path = l.pathname.replace(/^\/Bloom-and-Glow\/?/, '');
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/Bloom-and-Glow/#/' + path + (l.search ? l.search : '') + l.hash;
      l.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to Bloom & Glow...</p>
  </body>
</html>
